<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>Karbantartás alatt — SOULSILVER</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Manrope,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 20% -10%, #123a30 0%, transparent 60%),
               radial-gradient(1000px 700px at 110% 10%, #0e2a24 0%, transparent 55%),
               #0b0e11;
    color:#EDEFF2;
    padding:1.5rem;
  }
  .card{
    max-width:34rem;
    padding:2.4rem 2rem;
    border-radius:1.25rem;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.09);
    backdrop-filter:blur(14px);
  }
  .brand{ font-weight:800; letter-spacing:.02em; font-size:1.05rem; margin-bottom:1.4rem; }
  .brand .dot{ color:#22F0B4; }
  .spinner{
    width:2.4rem; height:2.4rem; margin:0 auto 1.4rem;
    border-radius:50%; border:3px solid rgba(34,240,180,0.25); border-top-color:#22F0B4;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{ font-size:clamp(1.4rem,1vw + 1.1rem,1.9rem); margin:0 0 .7rem; }
  p{ color:#9BA3AE; line-height:1.55; margin:0 0 .4rem; }
  a{ color:#22F0B4; text-decoration:none; }
  a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">SOULSILVER<span class="dot">.</span></div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Rövid karbantartás alatt vagyunk</h1>
    <p>Fejlesztünk valamit az oldalon — hamarosan visszatérünk, általában csak pár percről van szó.</p>
    <p>Sürgős esetben írj: <a href="mailto:info@soulsilvermarketing.com">info@soulsilvermarketing.com</a></p>
  </div>
</body>
</html>
